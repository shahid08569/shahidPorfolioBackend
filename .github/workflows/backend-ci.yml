name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore ShahidPortfolio.slnx

    - name: Build solution
      run: dotnet build ShahidPortfolio.slnx --configuration Release --no-restore

    - name: Run Unit & Integration Tests
      run: dotnet test ShahidPortfolio.slnx --configuration Release --no-build --verbosity normal

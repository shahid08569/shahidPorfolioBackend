name: Backend CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore ShahidPortfolio.slnx

    - name: Build solution
      run: dotnet build ShahidPortfolio.slnx --configuration Release --no-restore

    - name: Run Unit & Integration Tests
      run: dotnet test ShahidPortfolio.slnx --configuration Release --no-build --verbosity normal

  deploy:
    name: Deploy to MonsterASP.NET
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore ShahidPortfolio.slnx

    - name: Publish API project
      run: dotnet publish src/ShahidPortfolio.API/ShahidPortfolio.API.csproj --configuration Release --output ./publish

    - name: Deploy to MonsterASP via WebDeploy
      uses: rasmusbuchholdt/simply-web-deploy@2.1.0
      with:
        website-name: ${{ secrets.WEBSITE_NAME }}
        server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
        server-username: ${{ secrets.SERVER_USERNAME }}
        server-password: ${{ secrets.SERVER_PASSWORD }}
